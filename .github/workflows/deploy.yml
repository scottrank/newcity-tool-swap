# Publishes the site to the existing Cloudflare Pages project "newcitytoolswap".
# Push to main -> live site (newcitytoolswap.pages.dev).
# Push to any other branch -> a test copy at <branch>.newcitytoolswap.pages.dev.
name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a repository secret named CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Strip stray spaces or line breaks picked up when pasting the token.
          CLEAN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          # Describe the token without revealing it, to help diagnose paste mistakes.
          echo "Token length: ${#CLEAN}"
          echo "Characters other than letters, digits, - and _: $(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9_-' | wc -c)"
          case "$CLEAN" in *Bearer*|*curl*|*Authorization*) echo "::warning::The secret looks like it contains the test command, not just the token.";; esac
          echo "CF_TOKEN=$CLEAN" >> "$GITHUB_ENV"

      - name: Collect site files
        run: |
          mkdir -p dist
          cp index.html style.css app.js _worker.js dist/

      - name: Create the Pages project if it doesn't exist yet
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ env.CF_TOKEN }}
          wranglerVersion: "4"
          accountId: 07c44a9c36c6f9425f54d7fe8682c4a3
          command: pages project create newcitytoolswap --production-branch=main

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          wranglerVersion: "4"
          accountId: 07c44a9c36c6f9425f54d7fe8682c4a3
          command: pages deploy --project-name=newcitytoolswap --branch=${{ github.ref_name }} --commit-dirty=true
