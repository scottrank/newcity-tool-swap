<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>New City Tool Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">New City Tool Swap</div>
  <img class="logo" src="/newcity-logo.png" alt="New City Church">
  <nav>
    <a href="#tools" data-tab="tools">All tools</a>
    <a href="#shelf" data-tab="shelf">My shelf</a>
  </nav>
</header>
<section class="helpzone" hidden>
  <button id="askHelp" class="bigask" type="button"><span class="bigask-t">Need a hand with a project?</span><span class="bigask-s">Ask the guys for help</span></button>
  <div id="helpFeed"></div>
</section>
<main id="app"><p class="muted center">Loading…</p></main>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
